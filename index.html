  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Defensively unregister any previously installed service worker and
      // clear its caches. Old SW versions serve stale JS bundles that ignore
      // shipped fixes. After the first cleanup, force ONE hard reload so the
      // browser fetches fresh JS instead of the SW-cached copy already loaded.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var ALREADY = 'sw-cleanup-done';
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadSw = regs.length > 0;
          regs.forEach(function (r) { r.unregister(); });
          var cachePromise = (window.caches && caches.keys)
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();
          cachePromise.then(function () {
            if (hadSw && !sessionStorage.getItem(ALREADY)) {
              sessionStorage.setItem(ALREADY, '1');
              location.reload();
            }
          });
        }).catch(function () {});
      })();
    </script>
  </body>
